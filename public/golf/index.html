<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Flagcast</title>
<link rel="icon" href="/golf/brand/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/golf/brand/app-icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/golf/golf.css">
<style>
main { max-width: 640px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-left, 0px)) 60px max(16px, env(safe-area-inset-right, 0px)); }
.topbar h1 { font-size: 2.4rem; }
.topbar p { margin: 6px 0 0; color: var(--on-green-muted); max-width: 60ch; }
form { display: grid; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
label { display: grid; gap: 4px; font-size: .88rem; color: var(--muted); font-weight: 500; }
input { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
h2 { font-size: 1.5rem; margin: 30px 0 10px; }
.mine a { display: flex; justify-content: space-between; gap: 10px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink); margin-bottom: 8px; }
.mine span { color: var(--muted); font-size: .85rem; }
#err { color: var(--red); font-size: .9rem; }
</style>
</head>
<body>
<header class="topbar"><div style="max-width:640px;margin:0 auto"><div class="label">Live golf scoring</div><h1><img src="/golf/brand/wide-on-dark.svg" alt="Flagcast" style="height:56px;width:auto;display:block;margin:4px 0 2px"></h1><p>Live scoring for golf tournaments: cart scorecards on players’ phones, a live leaderboard, and big screens with the par 3s, contests and sponsors.</p></div></header>
<main>
  <form id="f">
    <h2 style="margin:0">New tournament</h2>
    <label>Tournament name<input id="name" required placeholder="2027 Member-Guest"></label>
    <label>Admin passcode<input id="pass" type="password" autocomplete="current-password" placeholder="Only needed if one is set"></label>
    <button class="btn primary" type="submit">Make the tournament</button>
    <div id="err" role="alert"></div>
  </form>
  <div id="mineWrap" hidden><h2>Tournaments on this computer</h2><div class="mine" id="mine"></div></div>
</main>
<script type="module">
const LS = 'golf:mine';
const get = () => { try { return JSON.parse(localStorage.getItem(LS)) || []; } catch { return []; } };
const mine = get();
if (mine.length) {
  document.getElementById('mineWrap').hidden = false;
  document.getElementById('mine').innerHTML = mine.map((m) => `<a href="/g/${m.id}/desk#${m.key}"><b></b><span>${new Date(m.at).toLocaleDateString()}</span></a>`).join('');
  document.querySelectorAll('#mine b').forEach((b, i) => (b.textContent = mine[i].name));
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  const name = document.getElementById('name').value.trim();
  try {
    const r = await fetch('/golf/api/new', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, pass: document.getElementById('pass').value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'That didn’t work. Try again.');
    try { localStorage.setItem(LS, JSON.stringify([{ id: j.id, key: j.key, name, at: Date.now() }, ...mine].slice(0, 30))); } catch {}
    location.href = `/g/${j.id}/desk#${j.key}&setup`;
  } catch (x) { err.textContent = x.message; }
});
</script>
</body>
</html>
