<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your sessions · Showcaller Sessions</title>
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="/sessions/guest/sessions.css">
<link rel="stylesheet" href="/sessions/account/account.css">
</head>
<body>
<header class="topnav">
  <div class="brand"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b0c0e" stroke-width="2.4" stroke-linecap="round"><rect x="2.5" y="6" width="8" height="12" rx="2"/><rect x="13.5" y="6" width="8" height="12" rx="2"/></svg></div><div><b>Showcaller Sessions</b><small>Your sessions</small></div></div>
  <div class="sp"></div>
  <span class="acc-me" id="me" hidden></span>
  <button class="btn soft sm" id="out" hidden>Sign out</button>
  <button class="themeb" id="themeb" aria-label="Switch light or dark"><svg class="ico moon"><use href="#i-moon"/></svg><svg class="ico sun"><use href="#i-sun"/></svg></button>
</header>

<main class="acc-center" id="signin" hidden>
  <div class="card acc-box">
    <h1 id="mtitle">Sign in</h1>
    <p id="mtext">Your Showcaller Sessions: plans, takes and edit links.</p>
    <form id="form" class="fields">
      <input type="text" id="email" inputmode="email" autocomplete="username" placeholder="you@example.com" aria-label="Your email" required>
      <input type="password" id="pw" autocomplete="current-password" placeholder="Password" aria-label="Password" required minlength="8">
      <button class="btn big" id="send">Sign in</button>
    </form>
    <p class="acc-err" id="err" hidden></p>
    <div class="acc-alt" id="alt"><button type="button" class="lnk" data-mode="up">Create an account</button><button type="button" class="lnk" data-mode="reset">Forgot password?</button></div>
    <div id="sent" hidden><h2>Check your email</h2><p id="senttext"></p><button class="btn soft sm" id="again">Back to sign in</button></div>
  </div>
</main>

<main class="acc" id="dash" hidden>
  <div class="acc-ok card" id="appok" hidden>You’re signed in on your Mac too. You can close this tab and go back to the Sessions app.</div>
  <aside class="acc-list" id="list" aria-label="Your sessions"></aside>
  <section class="acc-room" id="room"></section>
</main>

<div class="msg card" id="msg" hidden></div>
<script src="/sessions/guest/room-ui.js"></script>
<script src="/sessions/account/account.js"></script>
</body>
</html>
