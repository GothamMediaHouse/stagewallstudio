<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Edit together · Showcaller Sessions</title>
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="/sessions/guest/sessions.css">
<link rel="stylesheet" href="/sessions/edit/edit.css">
</head>
<body>
<header class="topnav">
  <div class="brand"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b0c0e" stroke-width="2.4" stroke-linecap="round"><rect x="2.5" y="6" width="8" height="12" rx="2"/><rect x="13.5" y="6" width="8" height="12" rx="2"/></svg></div><div><b id="ttl">Edit together</b><small id="len">Loading…</small></div></div>
  <div class="sp"></div>
  <div class="eds" id="people" aria-label="Who’s editing"></div>
  <span class="elive" id="live" title="Changes are shared as you make them">Connecting…</span>
  <button class="themeb" id="themeb" aria-label="Switch light or dark"><svg class="ico moon"><use href="#i-moon"/></svg><svg class="ico sun"><use href="#i-sun"/></svg></button>
</header>
<main class="eg" id="main" hidden>
  <section class="el">
    <div class="pic"><video id="v" playsinline preload="auto"></video><div class="who" id="who" hidden></div></div>
    <div class="trans"><button class="btn sm" id="play" aria-label="Play (space)"><svg class="ico"><use href="#e-play"/></svg></button><span class="num" id="tc">00:00</span>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Where in the edit"><span class="num" id="dur">00:00</span></div>
    <p class="hint">Select words and press Delete (or Cut) to take them out. Everyone working on this take sees each change as it happens, and the edit in the studio app changes with it. Double-click a word to fix its spelling.</p>
  </section>
  <section class="er card">
    <div class="tbar">
      <input type="search" id="find" placeholder="Find words" aria-label="Find words">
      <button class="btn soft sm" id="cut"><svg class="ico"><use href="#e-cut"/></svg>Cut</button>
      <button class="btn soft sm" id="restore">Restore</button>
      <button class="btn soft sm" id="undo" aria-label="Undo" title="Undo (Ctrl/⌘ Z)"><svg class="ico"><use href="#e-undo"/></svg></button>
      <button class="btn soft sm" id="redo" aria-label="Redo" title="Redo"><svg class="ico"><use href="#e-redo"/></svg></button>
      <span class="sp"></span>
      <button class="btn soft sm" id="fill">Cut “um”s</button>
      <button class="btn soft sm" id="pause">Shorten pauses</button>
    </div>
    <div class="tx" id="tx" tabindex="0"></div>
  </section>
</main>
<div class="msg card" id="msg" hidden></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="e-play" viewBox="0 0 24 24"><path d="M7 5v14l11-7z" fill="currentColor" stroke="none"/></symbol>
 <symbol id="e-pause" viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="currentColor" stroke="none"/></symbol>
 <symbol id="e-cut" viewBox="0 0 24 24"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M8.5 8.5 20 19M8.5 15.5 20 5"/></symbol>
 <symbol id="e-undo" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-2"/></symbol>
 <symbol id="e-redo" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h2"/></symbol>
</svg>
<script src="/sessions/guest/room-ui.js"></script>
<script src="/sessions/edit/transcript.js"></script>
<script src="/sessions/edit/edit.js"></script>
</body>
</html>
